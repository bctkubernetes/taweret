apiVersion: config.lighthouse.jenkins-x.io/v1alpha1
kind: TriggerConfig
spec:
  presubmits:
  - name: pr
    context: "pr"
    always_run: false
    optional: true
    trigger: "(?m)^/test( all| pr)?$"
    rerun_command: "/test pr"
    source: "pullrequest.yaml"
  postsubmits:
  - name: release
    context: "release"
    source: "release.yaml"
    # ci-skip: generated by bct-cluster/scripts/ci-skip-sync.py (openspec skip-ci-for-non-build-changes). Edit the pattern there, not here.
    ignore_changes: '^(openspec/|[^/]+\.md$|docs/.+\.md$|\.(?:agents|claude|cursor|windsurf|vscode|devcontainer|github|husky)/|\.lighthouse/|(?:[^/]+/)*okteto[^/]*\.ya?ml$|(?:OWNERS|OWNERS_ALIASES|LICENSE|NOTICE|\.gitignore|\.editorconfig|\.pre-commit-config\.yaml)$)'
    branches:
    - ^main$
    - ^master$
